name: "Build & Release APK"

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Custom build number override (leave empty to use default)'
        required: false
        default: ''

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up JDK 17 (Azul Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set Up Rust & Cargo Environment
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'
          cache: true

      - name: Extract Versions from pubspec.yaml
        id: extract_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          CSVERSION=$(grep '^code_server: ' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "CSVERSION=$CSVERSION" >> $GITHUB_ENV
          echo "Extracted App Version: $VERSION"
          echo "Extracted Code Server Version: $CSVERSION"

      - name: Ensure Assets Directory & Download Code Server
        run: |
          mkdir -p assets
          TARGET_FILE="assets/code-server-${{ env.CSVERSION }}-linux-arm64.tar.gz"
          if [ ! -f "$TARGET_FILE" ]; then
            echo "Downloading code-server $CSVERSION..."
            wget -q --show-progress -O "$TARGET_FILE" \
              "https://github.com/coder/code-server/releases/download/v${{ env.CSVERSION }}/code-server-${{ env.CSVERSION }}-linux-arm64.tar.gz" || true
          else
            echo "Asset already exists."
          fi

      - name: Configure Keystore & Signing
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding Keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD || 'codelfa123' }}" > android/key.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD || 'codelfa123' }}" >> android/key.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS || 'upload' }}" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          elif [ -f "android/key.properties" ] && [ -f "android/app/upload-keystore.jks" ]; then
            echo "Local keystore & key.properties found in repository workspace."
          else
            echo "No keystore secret provided. Generating a fallback signing key for release..."
            keytool -genkeypair -v \
              -keystore android/app/upload-keystore.jks \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass codelfa123 \
              -keypass codelfa123 \
              -dname "CN=Code LFA, OU=CI, O=CodeLFA, L=City, ST=State, C=US"
            echo "storePassword=codelfa123" > android/key.properties
            echo "keyPassword=codelfa123" >> android/key.properties
            echo "keyAlias=upload" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          fi

      - name: Install Flutter Dependencies
        run: |
          flutter pub get

      - name: Build Android Release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=VERSION="${{ env.VERSION }}" \
            --dart-define=CSVERSION="${{ env.CSVERSION }}"

      - name: Organize & Rename Built APKs
        id: organize_apks
        run: |
          mkdir -p output_apks
          cd build/app/outputs/apk/release
          for f in app-*-release.apk; do
            if [ -f "$f" ]; then
              arch=$(echo "$f" | sed -e 's/app-//' -e 's/-release.apk//')
              dest="output_apks/CodeLFA_${{ env.VERSION }}_${arch}.apk"
              cp "$f" "../../../../../$dest"
              echo "Prepared $dest"
            fi
          done

      - name: Upload APKs as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodeLFA-${{ env.VERSION }}-APKs
          path: output_apks/*.apk
          retention-days: 30
